<svg xmlns="http://www.w3.org/2000/svg" width="490" height="290" viewBox="0 0 490 290" role="img" aria-label="Navegação entre obras. Na página de cada obra, as setas levam à anterior e à próxima. Há também botões para repetir o zoom e para tela cheia."><title>Navegação entre obras. Na página de cada obra, as setas levam à anterior e à próxima. Há também botões para repetir o zoom e para tela cheia.</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f5c76a"/><stop offset="1" stop-color="#fde9b0"/></linearGradient><radialGradient id="fc" gradientUnits="userSpaceOnUse" cx="490" cy="0" r="220"><stop offset="0" stop-color="#f5c76a" stop-opacity="0.18"/><stop offset="1" stop-color="#f5c76a" stop-opacity="0"/></radialGradient><clipPath id="fk"><rect width="490" height="290" rx="22"/></clipPath></defs><rect x="0.5" y="0.5" width="489" height="289" rx="22" fill="#070b18" stroke="#2e2819"/><g clip-path="url(#fk)"><rect width="490" height="290" fill="url(#fc)"/><rect width="490" height="4" fill="url(#g)"/></g><text x="32" y="44" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.4" fill="#64748b">FUNCIONALIDADE 07</text><text x="32" y="82" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-size="28" font-weight="700" fill="#e2e8f0">Navegação entre obras</text><text x="32" y="116" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-size="14.5" fill="#94a3b8">Na página de cada obra, as setas levam à anterior e à</text><text x="32" y="138" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-size="14.5" fill="#94a3b8">próxima. Há também botões para repetir o zoom e para</text><text x="32" y="160" font-family="'Fraunces',Georgia,'Times New Roman',serif" font-size="14.5" fill="#94a3b8">tela cheia.</text></svg>